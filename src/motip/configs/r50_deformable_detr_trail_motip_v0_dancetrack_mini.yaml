# Trail-MOTIP V0 development config for the symlinked DanceTrack mini subset.
# Dataset selection is controlled with: --data-root ./datasets_mini/
SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_trail_motip_v0_dancetrack.yaml

