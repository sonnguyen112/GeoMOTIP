SUPER_CONFIG_PATH: ./configs/trail_v1/trail_v1_full.yaml
FREEZE_DETR: true
DETR_TRAIN_MODE: frozen
DETR_NUM_TRAIN_FRAMES: 0
DETR_NUM_CHECKPOINT_FRAMES: 1
MIXED_PRECISION: fp16
BATCH_SIZE: 1
ACCUMULATE_STEPS: 4
NUM_WORKERS: 2
PREFETCH_FACTOR: 2
GRADIENT_CHECKPOINTING: true
USE_DECODER_CHECKPOINT: true
# Unscale once before separate clipping (GradScaler cannot unscale twice).
USE_ACCELERATE_CLIP_NORM: false
