SUPER_CONFIG_PATH: ./configs/trail_v3/geometry_v3_a_4060ti.yaml

# Matched three-epoch warm-start comparison.  The MOTIP weights and all
# detector settings match matched_3epoch_e0.yaml; this arm adds the already
# pretrained PRED-PRED geometry scorer and fixed offline calibration.
USE_TRAIL: false
USE_GEOMETRY: true
FREEZE_MOTIP: false
INIT_CHECKPOINT: outputs/research_v3/short_tracker_fusion/t1_predpred_calibrated.pth

GEOMETRY_LAGS: [1, 2, 4, 8]
GEOMETRY_DIM: 66
GEOMETRY_HIDDEN_DIM: 128
GEOMETRY_INPUT_CLIP: 8.0
GEOMETRY_INPUT_NORMALIZE: true
GEOMETRY_INPUT_STATS_PATH: outputs/research_v3/geometry_probe/geometry_probe_models.pt
GEOMETRY_AUX_WEIGHT: 1.0
GEOMETRY_FUSED_WEIGHT: 1.0
GEOMETRY_FIXED_LAMBDA: 1.0
GEOMETRY_LEARNED_LAMBDA: false
GEOMETRY_BASE_TEMPERATURE: 2.0
GEOMETRY_TEMPERATURE: 0.5
GEOMETRY_VALIDATE_ALIGNMENT: true

DATASET_SPLITS: [val]
TRAIN_SEQUENCE_MANIFEST: ./configs/trail_v3/probe_train_manifest.txt
INFERENCE_SEQUENCE_MANIFEST: ./configs/trail_v3/probe_val_manifest.txt
INFERENCE_DATASET: DanceTrack
INFERENCE_SPLIT: val
INFERENCE_MODE: evaluate
INFERENCE_DTYPE: FP32

OUTPUTS_DIR: outputs/research_v3/matched_3epoch/v3
EXP_NAME: trail_motip_matched_3epoch_v3_s42
EPOCHS: 3
SAVE_CHECKPOINT_PER_EPOCH: 1
EVAL_EPOCHS: [0, 1, 2]
MAX_STEPS_PER_EPOCH: 0
RUNTIME_PROBE_STEPS: 0

# Keep the validated association-only recipe identical in both arms.
FREEZE_DETR: true
DETR_TRAIN_MODE: frozen
DETR_NUM_TRAIN_FRAMES: 0
DETR_NUM_CHECKPOINT_FRAMES: 1
MIXED_PRECISION: fp16
BATCH_SIZE: 1
ACCUMULATE_STEPS: 4
NUM_WORKERS: 2
PREFETCH_FACTOR: 2
GRADIENT_CHECKPOINTING: true
USE_DECODER_CHECKPOINT: true
USE_ACCELERATE_CLIP_NORM: false
SEPARATE_CLIP_NORM: true
MAX_CLIP_NORM: 0.1
LR: 1.0e-4
LR_WARMUP_EPOCHS: 1
SCHEDULER_MILESTONES: [6, 9]
USE_AUX_LOSS: false
