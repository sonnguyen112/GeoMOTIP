SUPER_CONFIG_PATH: ./configs/r50_deformable_detr_motip_dancetrack.yaml
# Original MOTIP recipe, plus the validated G4 branch. DDP: 2 * 1 * 4 = 8.
SEED: 42
FREEZE_DETR: false
DETR_TRAIN_MODE: full
FREEZE_MOTIP: false
USE_TRAIL: false
USE_SPATIAL_ANCHOR: false
USE_GEOMETRY: true
TRACKLET_CONFIRM_N_INIT: 1
GEOMETRY_LAGS: [1, 2, 4, 8]
GEOMETRY_DIM: 66
GEOMETRY_HIDDEN_DIM: 128
GEOMETRY_INPUT_NORMALIZE: true
GEOMETRY_INPUT_CLIP: 8.0
GEOMETRY_INPUT_STATS_PATH: outputs/research_v3/full_dancetrack_motip_s42_2a100/geometry_pretrain/probe/geometry_probe_models.pt
GEOMETRY_VALIDATE_ALIGNMENT: true
GEOMETRY_AUX_WEIGHT: 1.0
GEOMETRY_FUSED_WEIGHT: 1.0
GEOMETRY_FIXED_LAMBDA: 1.0
GEOMETRY_LEARNED_LAMBDA: false
GEOMETRY_BASE_TEMPERATURE: 2.0
GEOMETRY_TEMPERATURE: 0.5
ACCUMULATE_STEPS: 4
MIXED_PRECISION: 'no'
MAX_STEPS_PER_EPOCH: 0
RUNTIME_PROBE_STEPS: 0
LOGGING_INTERVAL: 20
EPOCH_RESUME_RNG: true
STOP_AFTER_EPOCH: -1
RECORD_ITERATION_TIMING: false
GRADIENT_CHECKPOINTING: false
INFERENCE_MAX_SHORTER: 800
INFERENCE_SEQUENCE_MANIFEST: outputs/research_v3/full_dancetrack_motip_s42_2a100/val_manifest.txt
# Full validation at predeclared epochs; all ten checkpoints are saved.
EVAL_EPOCHS: [0, 2, 4, 6, 8, 9]
